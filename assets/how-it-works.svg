<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="How AuraLab works: on your Mac, Claude Code reaches the lab GPU server rocco through a local gateway, a switch shim and an SSH tunnel, and DeepSeek Harness through the shim and the tunnel; AuraLab in the menu bar keeps them running and installs signed updates.">
